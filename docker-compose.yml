# Production: runs the published image from GitHub Container Registry.
# For local development against your own build, use docker-compose.dev.yml.
services:
  lastwar:
    image: ghcr.io/ewiggin101/lastwar-alliance-manager:latest
    container_name: lastwar-alliance
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Persist the SQLite database in a local ./data folder
      - ./data:/data
    environment:
      DATABASE_PATH: /data/alliance.db
      # Set SESSION_KEY via .env file or shell environment.
      # Generate one with: openssl rand -hex 32
      SESSION_KEY: "${SESSION_KEY}"
      # Optional FarmOps API key. If unset, Merit THP refresh uses WARDAWGG.
      LASTWAR_FARM_API_KEY: "${LASTWAR_FARM_API_KEY}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Public HTTPS entry point. Bind only the Oracle private interface so the
  # existing WireGuard-only status page can keep ports 80 and 443.
  web:
    image: caddy:2-alpine
    container_name: lastwar-alliance-web
    ports:
      - "10.0.1.148:80:80"
      - "10.0.1.148:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      lastwar:
        condition: service_healthy
    restart: unless-stopped
